<div class="min-h-screen bg-page">
  <div class="max-w-5xl mx-auto px-6 py-8">

    <!-- Page Title + Actions -->
    <div class="flex items-start justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-text">Add New Asset</h1>
        <p class="text-sm text-text-muted mt-1">Register a new piece of equipment to your AssetLink portfolio.</p>
      </div>
      <div class="flex items-center gap-3">
        <app-button variant="secondary" (clicked)="openDiscardModal()">Discard</app-button>
        <app-button variant="primary" [disabled]="isSubmitting" (clicked)="register()">
          <lucide-icon *ngIf="!isSubmitting" name="check" class="h-4 w-4"></lucide-icon>
          <span>{{ isSubmitting ? 'Registering…' : 'Register Asset' }}</span>
        </app-button>
      </div>
    </div>

    <!-- Toast messages -->
    <div *ngIf="submitSuccess"
         class="mb-5 px-4 py-3 rounded-xl bg-success-bg text-success text-sm font-medium flex items-center gap-2">
      <lucide-icon name="check-circle-2" class="h-4 w-4 flex-shrink-0"></lucide-icon>
      Asset registered successfully! Redirecting…
    </div>
    <div *ngIf="submitError"
         class="mb-5 px-4 py-3 rounded-xl bg-danger-bg text-danger text-sm font-medium flex items-center gap-2">
      <lucide-icon name="alert-triangle" class="h-4 w-4 flex-shrink-0"></lucide-icon>
      {{ submitError }}
    </div>

    <!-- Shared app-stepper -->
    <div class="mb-8">
      <app-stepper [steps]="stepperSteps" [currentStep]="currentStepIndex"></app-stepper>
    </div>

    <!-- Layout: Section nav + Content -->
    <div class="flex gap-6">

      <!-- Left Section Navigator -->
      <aside class="w-52 flex-shrink-0">
        <div class="bg-white rounded-xl border border-border p-3 sticky top-6">
          <p class="text-xs font-semibold text-text-muted uppercase tracking-wider px-3 mb-2">Sections</p>
          <nav class="flex flex-col gap-1">
            <button
              *ngFor="let s of navSections; let i = index"
              (click)="setSection(s.id, i)"
              [class]="activeSection === s.id
                ? 'flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-semibold bg-primary text-white w-full text-left'
                : 'flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium text-text-muted hover:bg-page hover:text-text w-full text-left'"
            >
              <lucide-icon [name]="s.icon" class="h-4 w-4 flex-shrink-0"></lucide-icon>
              <span>{{ s.label }}</span>
            </button>
          </nav>
        </div>
      </aside>

      <!-- Right Content Panel -->
      <main class="flex-1 min-w-0">
        <form [formGroup]="form" novalidate>
          <app-basic-info-section *ngIf="activeSection === 'basic-info'" [form]="form"></app-basic-info-section>
          <app-pricing-section    *ngIf="activeSection === 'pricing'"    [form]="form"></app-pricing-section>
          <app-images-section     *ngIf="activeSection === 'images'"     (imagesChange)="onImagesChange($event)"></app-images-section>
          <app-location-section   *ngIf="activeSection === 'location'"   [form]="form"></app-location-section>
        </form>

        <!-- Bottom prev / next navigation -->
        <div class="flex justify-between mt-6">
          <app-button variant="secondary" [disabled]="currentStepIndex === 0" (clicked)="prevSection()">
            <lucide-icon name="arrow-left" class="h-4 w-4"></lucide-icon>
            Previous
          </app-button>

          <app-button *ngIf="currentStepIndex < navSections.length - 1" variant="primary" (clicked)="nextSection()">
            Next
            <lucide-icon name="arrow-right" class="h-4 w-4"></lucide-icon>
          </app-button>

          <app-button *ngIf="currentStepIndex === navSections.length - 1" variant="success"
                      [disabled]="isSubmitting" (clicked)="register()">
            <lucide-icon name="check" class="h-4 w-4"></lucide-icon>
            Register Asset
          </app-button>
        </div>
      </main>
    </div>
  </div>
</div>

<!-- Shared app-modal: Discard confirmation -->
<app-modal
  [isOpen]="showDiscardModal"
  title="Discard Changes?"
  subtitle="All unsaved asset information will be lost."
  icon="⚠️"
  confirmText="Yes, Discard"
  cancelText="Keep Editing"
  size="sm"
  (confirm)="confirmDiscard()"
  (cancel)="showDiscardModal = false"
  (closed)="showDiscardModal = false"
></app-modal>
