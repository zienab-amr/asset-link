<app-auth-layout>
  <h1 class="text-2xl font-bold text-slate-900 mb-1 tracking-tight">Welcome back</h1>
  <p class="text-sm text-slate-500 mb-8">
    Sign in to your AssetLink account to continue.
  </p>

  <div class="bg-white rounded-[16px] p-6 shadow-sm border border-slate-100">
    <p *ngIf="errorMessage" class="text-sm text-danger bg-danger-bg p-2 rounded-md mb-4">
      {{ errorMessage }}
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-500 tracking-wide">EMAIL ADDRESS *</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Enter your email"
          class="w-full mt-1 px-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30"
        />
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-500 tracking-wide">PASSWORD *</label>
        <div class="relative mt-1">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
            class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30"
          />
          <button type="button" (click)="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">
            👁
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-slate-500">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          Remember me
        </label>
        <a routerLink="/forgot-password" class="text-blue-600 hover:underline">Forgot password?</a>
      </div>

      <app-button variant="primary" type="submit" [fullWidth]="true" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign in to AssetLink' }}
      </app-button>
    </form>
  </div>

  <p class="text-center text-sm text-slate-500 mt-6">
    Don't have an account?
    <a routerLink="/register" class="font-semibold text-blue-600 hover:text-blue-700 transition-colors">Register your company</a>
  </p>
</app-auth-layout>
