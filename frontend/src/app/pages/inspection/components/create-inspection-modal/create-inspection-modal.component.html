<app-modal
  [isOpen]="isOpen"
  title="{{ editData ? 'Fill Inspection Report' : 'Create Inspection Report' }}"
  subtitle="{{ editData ? 'Update pending task details' : 'Perform equipment inspection' }}"
  icon="clipboard-check" 
  [showConfirmButton]="false"
  [showCancelButton]="false"
  (closed)="closeModal()"
>
  <form
    [formGroup]="inspectionForm"
    (ngSubmit)="onSubmit()"
    class="space-y-4"
    dir="ltr"
  >

    <!-- Inspection Type -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
        Inspection Type
      </label>

      <select
        formControlName="inspectionType"
        class="w-full px-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-white disabled:bg-slate-100 disabled:text-slate-500"
      >
        <option
          *ngFor="let item of inspectionTypes"
          [value]="item.value"
        >
          {{ item.label }}
        </option>
      </select>
    </div>

    <!-- Booking -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
        Booking
      </label>

      <select
        formControlName="bookingId"
        (change)="onBookingChange()"
        class="w-full px-4 py-2.5 text-sm border rounded-xl disabled:bg-slate-100 disabled:text-slate-500"
      >
        <option value="">Select Booking</option>

        <option
          *ngFor="let booking of filteredBookings"
          [value]="booking._id"
        >
          {{ booking.bookingCode }}
          -
          {{ booking.assetId?.assetName }}
          ({{ booking.status }})
        </option>
      </select>
    </div>

    <!-- Asset -->
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">
        Asset
      </label>

      <select
        formControlName="assetId"
        class="w-full px-4 py-2.5 text-sm border rounded-xl disabled:bg-slate-100 disabled:text-slate-500"
      >
        <option value="">Select Asset</option>

        <option
          *ngFor="let asset of assets"
          [value]="asset._id"
        >
          {{ asset.assetCode }} - {{ asset.assetName }}
        </option>
      </select>
    </div>

    <!-- Inspector + Score -->
    <div class="grid grid-cols-2 gap-4">

      <div>
        <label class="block text-xs font-bold mb-1">
          Inspector Name
        </label>

        <input
          type="text"
          formControlName="inspectorName"
          class="w-full px-4 py-2 border rounded-xl disabled:bg-slate-100"
        />
      </div>

      <div>
        <label class="block text-xs font-bold mb-1">
          Condition Score
        </label>

        <input
          type="range"
          min="0"
          max="100"
          formControlName="conditionScore"
          class="w-full accent-blue-600"
        />

        <div class="text-center font-bold mt-1">
          {{ inspectionForm.get('conditionScore')?.value }} / 100
        </div>
      </div>

    </div>

    <!-- Registers -->
    <div class="grid grid-cols-2 gap-4">

      <div>
        <label class="block text-xs font-bold mb-1">
          Tax Register
        </label>

        <input
          type="text"
          formControlName="taxRegister"
          class="w-full px-4 py-2 border rounded-xl"
        />
      </div>

      <div>
        <label class="block text-xs font-bold mb-1">
          Commercial Register
        </label>

        <input
          type="text"
          formControlName="commercialRegister"
          class="w-full px-4 py-2 border rounded-xl"
        />
      </div>

    </div>

    <!-- Status -->
    <div>
      <label class="block text-xs font-bold mb-1">
        Inspection Result
      </label>

      <select
        formControlName="status"
        class="w-full px-4 py-2 border rounded-xl font-bold"
        [ngClass]="{
          'text-emerald-600': inspectionForm.get('status')?.value === 'Passed',
          'text-red-600': inspectionForm.get('status')?.value === 'Failed',
          'text-amber-500': inspectionForm.get('status')?.value === 'Pending'
        }"
      >
        <option
          *ngFor="let s of statuses"
          [value]="s"
        >
          {{ s }}
        </option>
      </select>
    </div>

    <!-- Damage Section -->
    <div
      *ngIf="inspectionForm.get('inspectionType')?.value==='after_use'"
      class="space-y-3 border rounded-xl p-4 bg-red-50"
    >

      <label class="flex items-center gap-2">

        <input
          type="checkbox"
          formControlName="hasDamage"
        >

        Asset has damage

      </label>

      <div *ngIf="inspectionForm.get('hasDamage')?.value">

        <label class="block text-xs font-bold mb-1">
          Damage Level
        </label>

        <select
          formControlName="damageLevel"
          class="w-full px-4 py-2 border rounded-xl"
        >
          <option
            *ngFor="let d of damageLevels"
            [value]="d"
          >
            {{ d }}
          </option>
        </select>

      </div>

      <div *ngIf="inspectionForm.get('hasDamage')?.value">

        <label class="block text-xs font-bold mb-1">
          Estimated Damage Cost
        </label>

        <input
          type="number"
          formControlName="damageCost"
          class="w-full px-4 py-2 border rounded-xl"
        />

      </div>

    </div>

    <!-- Photos -->
    <div>
      <label class="block text-xs font-bold mb-2">
        Inspection Photos
      </label>
      
      <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl">
        <app-image-gallery
          [images]="inspectionPhotos"
          [maxImages]="8"
          (imagesChange)="onPhotosUploaded($event)"
        ></app-image-gallery>
      </div>
    </div>

    <!-- Checklist -->
    <div>
      <label class="block text-xs font-bold mb-2">
        Checklist
      </label>

      <div class="flex flex-wrap gap-3">

        <label
          *ngFor="let item of ['brakes','engine','body','tires','lights']"
          class="flex items-center gap-2 bg-slate-50 border px-3 py-1.5 rounded-lg cursor-pointer hover:bg-slate-100"
        >

          <input
            type="checkbox"
            [formControlName]="item"
          >
          <span class="capitalize text-sm font-medium">{{ item }}</span>
        </label>

      </div>

    </div>

    <!-- Notes -->
    <div>
      <label class="block text-xs font-bold mb-1">
        Notes
      </label>

      <textarea
        rows="3"
        formControlName="notes"
        class="w-full px-4 py-2 border rounded-xl"
        placeholder="Add any additional remarks here..."
      ></textarea>

    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-3 pt-4">

      <button
        type="button"
        (click)="closeModal()"
        class="px-5 py-2 border rounded-xl hover:bg-slate-50 transition-colors font-semibold text-slate-600"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="isSubmitting"
        class="px-6 py-2 bg-blue-600 text-white font-bold rounded-xl disabled:opacity-50 hover:bg-blue-700 transition-colors"
      >
        {{ editData ? 'Save Report' : 'Submit Inspection' }}
      </button>

    </div>

  </form>
</app-modal>
