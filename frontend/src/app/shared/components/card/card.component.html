<div
  class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300"
>
  <!-- Header -->
  <div
    class="relative h-40 overflow-hidden flex items-center justify-center border-b border-slate-100"
    style="
      background:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        #191e32;
      background-size: 20px 20px;
    "
  >
    <!-- Dynamic Background Orb -->
    <div class="absolute w-64 h-64 rounded-full blur-3xl opacity-20 pointer-events-none transition-colors duration-500" [ngClass]="categoryBgClass"></div>

    <!-- Real Asset Image -->
    <img *ngIf="image" [src]="image" class="absolute inset-0 w-full h-full object-cover z-0" alt="Asset Image">

    <!-- Status -->
    <span
      class="absolute left-3 top-3 px-2.5 py-1 rounded-full text-[10px] font-semibold z-20 flex items-center gap-1.5 shadow-sm"
      [ngClass]="statusClass"
    >
      <span class="w-1.5 h-1.5 rounded-full bg-current opacity-75"></span>
      {{ status }}
    </span>

    <!-- Health Score -->
    <span
      class="absolute right-3 top-3 px-2.5 py-1 rounded-full text-[10px] font-bold shadow-sm z-20 bg-white/10 text-white backdrop-blur-sm flex items-center gap-1.5"
    >
      <span class="w-1.5 h-1.5 rounded-full" [ngClass]="score >= 90 ? 'bg-emerald-400' : (score >= 70 ? 'bg-amber-400' : 'bg-red-400')"></span>
      {{ score }}
    </span>

    <!-- Asset Icon (Fallback) -->
    <div *ngIf="!image" class="text-center z-10 flex flex-col items-center">
      <div class="w-14 h-14 rounded-2xl border border-white/10 flex items-center justify-center bg-white/5 backdrop-blur-sm mb-3">
        <lucide-icon [name]="categoryIcon" class="w-6 h-6" [ngClass]="categoryColorClass"></lucide-icon>
      </div>

      <div
        class="uppercase tracking-[3px] text-[9px] font-bold"
        [ngClass]="categoryColorClass"
      >
        {{ subtitle }}
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="p-3.5">
    <div class="flex justify-between items-start mb-1.5">
      <h3 class="text-[13px] font-bold text-slate-800 line-clamp-1 leading-tight">
        {{ title }}
      </h3>
      <button class="text-slate-400 hover:text-slate-600 transition-colors">
        <lucide-icon name="more-horizontal" class="w-4 h-4"></lucide-icon>
      </button>
    </div>

    <!-- Code & Company -->
    <div class="flex items-center gap-1.5 text-[10px] text-slate-400 mb-2 font-medium">
      <span class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-500">{{ code }}</span>
      <span class="truncate">{{ company }}</span>
    </div>

    <!-- Rating / Rentals (Placeholder) -->
    <div class="flex items-center gap-1 text-[9px] text-slate-400 mb-4 font-medium">
      <div class="flex gap-0.5 text-amber-400">
        <lucide-icon name="star" class="w-2.5 h-2.5 fill-amber-400"></lucide-icon>
        <lucide-icon name="star" class="w-2.5 h-2.5 fill-amber-400"></lucide-icon>
        <lucide-icon name="star" class="w-2.5 h-2.5 fill-amber-400"></lucide-icon>
        <lucide-icon name="star" class="w-2.5 h-2.5 fill-amber-400"></lucide-icon>
        <lucide-icon name="star-half" class="w-2.5 h-2.5 fill-amber-400"></lucide-icon>
      </div>
      <span class="ml-0.5 text-slate-600">4.8</span>
      <span>•</span>
      <span>53 Rentals</span>
    </div>

    <!-- Pricing -->
    <div class="mb-3">
      <div class="flex items-baseline gap-1">
        <span class="text-[15px] font-extrabold text-slate-900 tracking-tight">{{ priceValue }}</span>
        <span class="text-[10px] text-slate-400 font-medium">{{ priceUnit }}</span>
      </div>
      <div class="flex items-center gap-1.5 text-[9px] text-slate-400 font-medium mt-0.5">
        <span *ngIf="weekly">{{ weekly }}</span>
        <span *ngIf="monthly">{{ monthly }}</span>
      </div>
    </div>

    <!-- Footer info -->
<div class="flex items-center justify-between text-[10px] font-medium text-slate-400 mb-4 pb-3 border-b border-slate-100">
  <div class="flex items-center gap-1">
    <lucide-icon name="map-pin" class="w-3 h-3 text-rose-500"></lucide-icon>
    <span class="truncate max-w-[90px]">{{ location }}</span>
  </div>
  
  <div *ngIf="isRentedOrBooked && waitlistCount > 0" class="flex items-center gap-1 text-orange-500 font-semibold">
    <lucide-icon name="user" class="w-3 h-3"></lucide-icon>
    <span>{{ waitlistCount }} waiting</span>
  </div>
  
  <span *ngIf="!isRentedOrBooked || waitlistCount === 0" [ngClass]="isAvailable ? 'text-emerald-500 font-semibold' : ''">
    {{ isAvailable ? 'Available now' : ('From ' + date) }}
  </span>
</div>

<!-- Actions -->
<div class="flex items-center gap-2">
  <app-button variant="secondary" class="flex-1" [fullWidth]="true" (clicked)="onDetailsClick($event)">
    Details
  </app-button>
  <app-button
    [variant]="buttonVariant"
    class="flex-1"
    [fullWidth]="true"
    [disabled]="!isAvailable && !isRentedOrBooked" 
    (clicked)="onBookClick($event)"
  >
    {{ buttonText }}
  </app-button>
</div>
