<div class="flex h-screen w-[300px] flex-col bg-[#111827] text-white">

  <!-- Logo -->
  <div class="border-b border-slate-700 px-6 py-6">
    <div class="flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600">
        <lucide-icon name="layers" class="h-6 w-6 text-white"></lucide-icon>
      </div>
      <div>
        <h2 class="text-xl font-bold">AssetLink</h2>
        <p class="text-xs uppercase tracking-widest text-slate-400">Enterprise</p>
      </div>
    </div>
  </div>

  <!-- Menu -->
  <div class="flex-1 overflow-y-auto px-4 py-6">
    <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-widest text-slate-500">Platform</p>
    
    <div class="space-y-1">
      <a *ngFor="let item of platformItems"
         [routerLink]="item.route"
         routerLinkActive="bg-[#2563EB] text-white shadow-md"
         [routerLinkActiveOptions]="{ exact: true }"
         class="group flex h-12 items-center justify-between rounded-xl px-4 text-[15px] font-medium text-slate-300 transition-all duration-200 hover:bg-slate-800 hover:text-white">
        <div class="flex items-center gap-3">
          <lucide-icon [name]="item.icon" class="h-5 w-5 transition-colors group-hover:text-white"></lucide-icon>
          <span class="font-medium">{{ item.title }}</span>
        </div>
      </a>
    </div>

    <div class="mt-2" *ngIf="accountItems.length > 0">
      <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">ACCOUNT</p>
      <div class="space-y-1">
        <a *ngFor="let item of accountItems"
           [routerLink]="item.route"
           routerLinkActive="bg-[#2563EB] text-white shadow-md"
           [routerLinkActiveOptions]="{ exact: true }"
           class="group flex h-12 items-center justify-between rounded-xl px-4 text-[15px] font-medium text-slate-300 transition-all duration-200 hover:bg-slate-800 hover:text-white">
          <div class="flex items-center gap-3">
            <lucide-icon [name]="item.icon" class="h-5 w-5"></lucide-icon>
            <span class="font-medium">{{ item.title }}</span>
          </div>
        </a>
      </div>
    </div>
  </div>

  <!-- User Profile -->
  <div class="rounded-xl border border-[#2563EB] bg-[#172554] px-3 py-3">
    <button type="button" (click)="logout()" class="group flex h-[72px] w-full items-center justify-between rounded-xl px-3 py-2.5">
      <div class="flex items-center gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-full bg-sky-500">
          <span class="text-white font-bold">{{ initials || 'U' }}</span>
        </div>
        <div class="text-left">
          <h4 class="text-[15px] font-semibold text-white">{{ companyName || 'User' }}</h4>
          <p class="text-xs text-slate-400">{{ companyRole || 'Role' }}</p>
        </div>
      </div>
      
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500 transition group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</div>
