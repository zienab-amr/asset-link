<div class="flex h-screen flex-col bg-[#111827] text-white transition-all duration-300"
     [ngClass]="isCollapsed ? 'w-[80px]' : 'w-[300px]'">

  <!-- Logo -->
  <div class="border-b border-slate-700 px-4 py-6 shrink-0">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-blue-600">
          <lucide-icon name="layers" class="h-6 w-6 text-white"></lucide-icon>
        </div>
        <div *ngIf="!isCollapsed" class="overflow-hidden whitespace-nowrap">
          <h2 class="text-xl font-bold leading-tight">AssetLink</h2>
          <p class="text-xs uppercase tracking-widest text-slate-400">Enterprise</p>
        </div>
      </div>

      <!-- Toggle Button (expanded state) -->
      <button
        *ngIf="!isCollapsed"
        type="button"
        (click)="toggleSidebar()"
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white cursor-pointer transition-colors"
        title="Collapse sidebar"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
        </svg>
      </button>
    </div>

    <!-- Toggle Button (collapsed state, centered below logo) -->
    <button
      *ngIf="isCollapsed"
      type="button"
      (click)="toggleSidebar()"
      class="mt-3 flex h-8 w-full items-center justify-center rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white cursor-pointer transition-colors"
      title="Expand sidebar"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <!-- Menu -->
  <div class="sidebar-scroll flex-1 overflow-y-auto overflow-x-hidden px-3 py-6">
    <p *ngIf="!isCollapsed" class="mb-3 px-3 text-xs font-semibold uppercase tracking-widest text-slate-500">Platform</p>

    <div class="space-y-1">
      <a *ngFor="let item of platformItems"
         [routerLink]="item.route"
         routerLinkActive="bg-[#2563EB] text-white shadow-md"
         [routerLinkActiveOptions]="{ exact: true }"
         [title]="isCollapsed ? item.title : ''"
         class="group flex h-12 items-center rounded-xl px-4 text-[15px] font-medium text-slate-300 transition-all duration-200 hover:bg-slate-800 hover:text-white"
         [ngClass]="isCollapsed ? 'justify-center' : 'justify-between'">
        <div class="flex items-center gap-3 overflow-hidden">
          <lucide-icon [name]="item.icon" class="h-5 w-5 shrink-0 text-slate-400 transition-colors group-hover:text-white"></lucide-icon>
          <span *ngIf="!isCollapsed" class="font-medium whitespace-nowrap">{{ item.title }}</span>
        </div>
      </a>
    </div>

    <div class="mt-6" *ngIf="accountItems.length > 0">
      <p *ngIf="!isCollapsed" class="mb-3 px-3 text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">ACCOUNT</p>
      <div class="space-y-1">
        <a *ngFor="let item of accountItems"
           [routerLink]="item.route"
           routerLinkActive="bg-[#2563EB] text-white shadow-md"
           [routerLinkActiveOptions]="{ exact: true }"
           [title]="isCollapsed ? item.title : ''"
           class="group flex h-12 items-center rounded-xl px-4 text-[15px] font-medium text-slate-300 transition-all duration-200 hover:bg-slate-800 hover:text-white"
           [ngClass]="isCollapsed ? 'justify-center' : 'justify-between'">
          <div class="flex items-center gap-3 overflow-hidden">
            <lucide-icon [name]="item.icon" class="h-5 w-5 shrink-0 text-slate-400"></lucide-icon>
            <span *ngIf="!isCollapsed" class="font-medium whitespace-nowrap">{{ item.title }}</span>
          </div>
        </a>
      </div>
    </div>
  </div>

  <!-- User Profile -->
  <div class="shrink-0 border-t border-slate-800 p-3">
    <button type="button" (click)="logout()"
            class="group flex w-full items-center rounded-xl bg-slate-800/50 px-3 py-2.5 transition-colors hover:bg-slate-800"
            [ngClass]="isCollapsed ? 'h-14 justify-center' : 'h-[68px] justify-between'"
            [title]="isCollapsed ? (companyName || 'User') : ''">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-sky-500">
          <span class="text-sm font-bold text-white">{{ initials || 'U' }}</span>
        </div>
        <div *ngIf="!isCollapsed" class="overflow-hidden text-left">
          <h4 class="truncate text-[14px] font-semibold text-white">{{ companyName || 'User' }}</h4>
          <p class="truncate text-xs text-slate-400">{{ companyRole || 'Role' }}</p>
        </div>
      </div>

      <svg *ngIf="!isCollapsed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-slate-500 transition-colors group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</div>
